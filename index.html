<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade</title>
    <link rel="stylesheet" href="style.css">
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
</head>

<body>
    <div class="left_side">
        <div class="container">
            <div class="row" style="justify-content: center;">
                <i class="fi fi-sr-joystick" style="font-size: 40px;"></i>
                <div class="column title" style="width: auto;">
                    <h1>Projeto</h1>
                    <h2>Arcade</h2>
                </div>
            </div>
            <div class="column">
                <div class="row option selected"><i class="fi fi-sr-console-controller" style="margin-left: 15px;"></i>
                    <b>comunidade</b>
                </div>
                <div class="row option"><i class="fi fi-sr-game-console-crank-handheld" style="margin-left: 15px;"></i>
                    <b>Emuladores</b>
                </div>
                <div class="row option"><i class="fi fi-sr-settings" style="margin-left: 15px;"></i>
                    <b>Configurações</b>
                </div>
            </div>
            <div class="column">
                <div class="row">
                    <b style="font-size: 12px;">ULTIMOS JOGADOS</b>
                </div>
                <div class="row"><img class="game_image" src="https://m.media-amazon.com/images/I/61M3rDwh4qL.png">
                    Tetris</div>
                <div class="row"><img class="game_image"
                        src="https://upload.wikimedia.org/wikipedia/en/8/81/Street_Fighter_II_Hyper_Fighting_cover.jpg">
                    Street fighter</div>
                <div class="row"><img class="game_image"
                        src="https://upload.wikimedia.org/wikipedia/pt/f/ff/Mortal_Kombat_Trilogy_cover.png"> Mortal
                    Kombat</div>
            </div>
        </div>
    </div>
    <div class="right_side">
        <div class="slider">
            <div class="slider_holder" id="slider_holder">
            </div>
        </div>
        <h3 id="nome_jogo"></h3>
        <h3 id="counter"></h3>
        <p>Pressione <i class="fi fi-sr-circle-a"></i> para iniciar o jogo</p>
    </div>
</body>
<script src="script.js"></script>

</html>
